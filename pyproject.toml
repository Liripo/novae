[project]
name = "novae"
version = "0.10.0"
description = "生信智能体平台"
readme = "README.md"
authors = [
    { name = "Liripo", email = "liripo@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agentscope[service,storage]>=2.0.4",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.10.0",
    "fastapi[standard]>=0.138.0",
    "typer>=0.26.7",
    "loguru>=0.7.0",
    "httpx>=0.28.0",
    "ddgs>=9.0.0",
    "trafilatura>=2.0.0",
]

[project.scripts]
novae = "novae.main:app"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.20.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
